<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="hd-title hd-desc">
  <title id="hd-title">After the Experiment: What Stays Hand-Written vs. What Gets Delegated</title>
  <desc id="hd-desc">Split card diagram comparing what the author now writes by hand versus what gets delegated to an AI agent after the one-month experiment. The hand-written column lists core domain logic, tricky or novel debugging, and security-adjacent code. The delegated column lists boilerplate and CRUD, test scaffolding, documentation, and repetitive refactors.</desc>
  <defs>
    <linearGradient id="hd-bg" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1625"/>
      <stop offset="55%" stop-color="#111f33"/>
      <stop offset="100%" stop-color="#1a2f45"/>
    </linearGradient>
    <linearGradient id="hd-cardPink" x1="0" y1="130" x2="0" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,106,158,0.10)"/>
      <stop offset="100%" stop-color="rgba(255,106,158,0.02)"/>
    </linearGradient>
    <linearGradient id="hd-cardCyan" x1="0" y1="130" x2="0" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(78,203,255,0.09)"/>
      <stop offset="100%" stop-color="rgba(78,203,255,0.02)"/>
    </linearGradient>
    <linearGradient id="hd-pinkDot" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6a9e"/>
      <stop offset="100%" stop-color="#ffc17d"/>
    </linearGradient>
    <linearGradient id="hd-cyanDot" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ecbff"/>
      <stop offset="100%" stop-color="#7df5f2"/>
    </linearGradient>
    <filter id="hd-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .hd-title { font: 700 30px 'Space Grotesk', sans-serif; fill: #e8f6ff; }
      .hd-sub   { font: 500 15px 'Space Mono', monospace; fill: #9bc0d8; }
      .hd-head  { font: 700 20px 'Space Grotesk', sans-serif; }
      .hd-headSub { font: 500 13px 'Space Mono', monospace; fill: #7aaabf; }
      .hd-item  { font: 600 16px 'Space Grotesk', sans-serif; fill: #dcecf6; }
      .hd-desc  { font: 500 13px 'Space Mono', monospace; fill: #6f95ac; }
      .hd-foot  { font: 500 12px 'Space Mono', monospace; fill: #3d6478; }
    </style>
  </defs>

  <rect width="1200" height="560" fill="url(#hd-bg)"/>

  <!-- header -->
  <text class="hd-title" x="60" y="58">What Stays Hand-Written vs. What Gets Delegated</text>
  <text class="hd-sub"   x="60" y="85">The split I settled on after going back to AI agents on day thirty-two</text>

  <!-- divider -->
  <line x1="600" y1="118" x2="600" y2="520" stroke="#2a4a62" stroke-width="1"/>

  <!-- LEFT CARD: hand-written -->
  <rect x="60" y="118" width="500" height="402" rx="16" fill="url(#hd-cardPink)" stroke="rgba(255,106,158,0.35)" stroke-width="1.2"/>
  <circle cx="100" cy="160" r="7" fill="url(#hd-pinkDot)" filter="url(#hd-glow)"/>
  <text class="hd-head" x="120" y="167" fill="#ff9dbc">HAND-WRITTEN</text>
  <text class="hd-headSub" x="100" y="192">Where understanding has to compound</text>

  <line x1="100" y1="212" x2="520" y2="212" stroke="rgba(255,106,158,0.25)" stroke-width="1"/>

  <text class="hd-item" x="100" y="248">Core domain logic</text>
  <text class="hd-desc" x="100" y="270">The business rules a client's system actually runs on.</text>

  <text class="hd-item" x="100" y="312">Tricky or novel debugging</text>
  <text class="hd-desc" x="100" y="334">Anything without a working theory yet — built by hand,</text>
  <text class="hd-desc" x="100" y="352">not handed off with a stack trace.</text>

  <text class="hd-item" x="100" y="394">Security-adjacent code</text>
  <text class="hd-desc" x="100" y="416">Auth, payments, anything touching user data.</text>

  <text class="hd-item" x="100" y="458">First pass on a new system</text>
  <text class="hd-desc" x="100" y="480">The mental model has to start somewhere.</text>

  <!-- RIGHT CARD: delegated -->
  <rect x="640" y="118" width="500" height="402" rx="16" fill="url(#hd-cardCyan)" stroke="rgba(78,203,255,0.35)" stroke-width="1.2"/>
  <circle cx="680" cy="160" r="7" fill="url(#hd-cyanDot)" filter="url(#hd-glow)"/>
  <text class="hd-head" x="700" y="167" fill="#7ee0ff">DELEGATED TO AGENTS</text>
  <text class="hd-headSub" x="680" y="192">Where the understanding never needed to be mine</text>

  <line x1="680" y1="212" x2="1100" y2="212" stroke="rgba(78,203,255,0.25)" stroke-width="1"/>

  <text class="hd-item" x="680" y="248">Boilerplate and CRUD</text>
  <text class="hd-desc" x="680" y="270">Standard endpoints, standard shapes, standard fixes.</text>

  <text class="hd-item" x="680" y="312">Test scaffolding</text>
  <text class="hd-desc" x="680" y="334">Generated first, then read and checked before it merges.</text>

  <text class="hd-item" x="680" y="376">Docs and comments</text>
  <text class="hd-desc" x="680" y="398">First drafts only — always reviewed, never assumed correct.</text>

  <text class="hd-item" x="680" y="440">Repetitive refactors</text>
  <text class="hd-desc" x="680" y="462">The same mechanical change, applied across many files.</text>

  <!-- footer -->
  <text class="hd-foot" x="60" y="546">One developer's own working split, not a universal rule — the point is drawing the line deliberately.</text>
</svg>
