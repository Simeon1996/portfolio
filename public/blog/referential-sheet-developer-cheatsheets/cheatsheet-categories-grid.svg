<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="grid-title grid-desc">
  <title id="grid-title">54 Cheatsheets, Organized the Way You'd Actually Look</title>
  <desc id="grid-desc">Grid of eight category cards from ReferentialSheet's public cheatsheet library — Cloud and Infra, Databases, DevOps and Config, Programming and Web, Data Science and Math, Security and Networking, Developer Tools, and Misc — each card listing a few example cheatsheet names such as AWS CLI, Terraform, MongoDB, Docker, Kubernetes, Python, Pandas, OWASP Top 10, Git, and Cron Expressions, with a note that more sheets exist in each category.</desc>
  <defs>
    <linearGradient id="grid-bg" x1="0" y1="0" x2="1400" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1625"/>
      <stop offset="55%" stop-color="#111f33"/>
      <stop offset="100%" stop-color="#1a2f45"/>
    </linearGradient>
    <linearGradient id="grid-pink" x1="0" y1="0" x2="302" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6a9e"/>
      <stop offset="100%" stop-color="#ffc17d"/>
    </linearGradient>
    <linearGradient id="grid-cyan" x1="0" y1="0" x2="302" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ecbff"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <filter id="grid-glow" x="-20%" y="-60%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .grid-title  { font: 700 28px 'Space Grotesk', sans-serif; fill: #e8f6ff; }
      .grid-sub    { font: 500 15px 'Space Mono', monospace; fill: #9bc0d8; }
      .grid-cat    { font: 700 18px 'Space Grotesk', sans-serif; fill: #eaf6ff; }
      .grid-item   { font: 500 14px 'Space Mono', monospace; fill: #c8e6f8; }
      .grid-more   { font: 500 12.5px 'Space Mono', monospace; fill: #6ee7b7; }
      .grid-snip   { font: 500 11.5px 'Space Mono', monospace; fill: #4d7691; }
      .grid-foot   { font: 500 12px 'Space Mono', monospace; fill: #3d6478; }
    </style>
  </defs>

  <rect width="1400" height="760" fill="url(#grid-bg)"/>
  <g opacity="0.05" stroke="#5fa2d0" stroke-width="1">
    <line x1="0" y1="190" x2="1400" y2="190"/>
    <line x1="0" y1="380" x2="1400" y2="380"/>
    <line x1="0" y1="570" x2="1400" y2="570"/>
  </g>

  <text class="grid-title" x="60" y="54">54 Cheatsheets, Organized the Way You'd Actually Look</text>
  <text class="grid-sub" x="60" y="82">Eight categories in the public ReferentialSheet library</text>

