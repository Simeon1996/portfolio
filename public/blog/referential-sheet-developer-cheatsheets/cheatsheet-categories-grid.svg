    <circle cx="22" cy="116" r="3" fill="#9cf0d8"/><text class="grid-item" x="34" y="121">React</text>
    <circle cx="22" cy="148" r="3" fill="#9cf0d8"/><text class="grid-item" x="34" y="153">CSS Grid</text>
