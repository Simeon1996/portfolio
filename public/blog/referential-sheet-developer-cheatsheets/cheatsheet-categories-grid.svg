    <rect x="16" y="16" width="270" height="6" rx="3" fill="url(#grid-pink)" filter="url(#grid-glow)"/>
    <text class="grid-cat" x="16" y="54">Cloud &amp; Infra</text>
    <circle cx="22" cy="84" r="3" fill="#ffaac8"/><text class="grid-item" x="34" y="89">AWS CLI</text>
    <circle cx="22" cy="116" r="3" fill="#ffaac8"/><text class="grid-item" x="34" y="121">Terraform</text>
    <circle cx="22" cy="148" r="3" fill="#ffaac8"/><text class="grid-item" x="34" y="153">Azure CLI</text>
    <text class="grid-more" x="16" y="188">+ Pulumi, CloudFormation, GKE CLI &amp; more</text>
    <text class="grid-snip" x="16" y="222">6–13 snippets per sheet</text>
