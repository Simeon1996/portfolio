<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="svr-title svr-desc">
  <title id="svr-title">Where Your Commands Actually Live</title>
  <desc id="svr-desc">Diagram contrasting five scattered sources of command knowledge — browser tabs, shell history, dotfiles, a notes app, and a Slack message to yourself — on the left, with a single organized, searchable ReferentialSheet workspace of color-coded category chips with one-click copy on the right, connected by an arrow labeled organize once, find it every time.</desc>
  <defs>
    <linearGradient id="svr-bg" x1="0" y1="0" x2="1400" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1625"/>
      <stop offset="55%" stop-color="#111f33"/>
      <stop offset="100%" stop-color="#1a2f45"/>
    </linearGradient>
    <linearGradient id="svr-pink" x1="60" y1="0" x2="620" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6a9e"/>
      <stop offset="100%" stop-color="#ffc17d"/>
    </linearGradient>
    <linearGradient id="svr-cyan" x1="760" y1="0" x2="1340" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ecbff"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="svr-chip1" x1="0" y1="0" x2="170" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c3a52"/>
      <stop offset="100%" stop-color="#173049"/>
    </linearGradient>
    <filter id="svr-glow" x="-20%" y="-40%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .svr-title  { font: 700 30px 'Space Grotesk', sans-serif; fill: #e8f6ff; }
      .svr-sub    { font: 500 15px 'Space Mono', monospace; fill: #9bc0d8; }
      .svr-group  { font: 700 14px 'Space Grotesk', sans-serif; letter-spacing: 1.5px; }
      .svr-card-t { font: 700 16px 'Space Grotesk', sans-serif; fill: #eaf6ff; }
      .svr-card-s { font: 500 12.5px 'Space Mono', monospace; fill: #86adc4; }
      .svr-badge  { font: 700 13px 'Space Mono', monospace; fill: #0a1625; }
      .svr-chip   { font: 600 13.5px 'Space Grotesk', sans-serif; fill: #d6ecfb; }
      .svr-note   { font: 500 13px 'Space Mono', monospace; fill: #7aaabf; }
      .svr-foot   { font: 500 12px 'Space Mono', monospace; fill: #3d6478; }
      .svr-search { font: 500 14px 'Space Mono', monospace; fill: #cdeaff; }
      .svr-hint   { font: 500 12px 'Space Mono', monospace; fill: #6ee7b7; }
    </style>
  </defs>

  <rect width="1400" height="800" fill="url(#svr-bg)"/>
  <g opacity="0.06" stroke="#5fa2d0" stroke-width="1">
    <line x1="0" y1="200" x2="1400" y2="200"/>
    <line x1="0" y1="400" x2="1400" y2="400"/>
    <line x1="0" y1="600" x2="1400" y2="600"/>
  </g>

  <text class="svr-title" x="60" y="58">Where Your Commands Actually Live</text>
  <text class="svr-sub" x="60" y="86">Five scattered sources of half-remembered knowledge, or one place to search</text>

  <!-- LEFT: scattered sources -->
  <text class="svr-group" x="60" y="132" fill="#ffaac8">RIGHT NOW</text>

  <!-- Card 1: Browser Tabs -->
  <g transform="translate(60,150) rotate(-1.5)">
    <rect width="560" height="78" rx="10" fill="url(#svr-chip1)" stroke="#2a4864" stroke-width="1"/>
    <rect x="16" y="14" width="50" height="50" rx="10" fill="url(#svr-pink)" filter="url(#svr-glow)"/>
    <text class="svr-badge" x="41" y="45" text-anchor="middle">TAB</text>
    <text class="svr-card-t" x="84" y="34">Browser Tabs</text>
    <text class="svr-card-s" x="84" y="55">42 pinned docs pages, permanently open, never closed</text>
  </g>

  <!-- Card 2: Shell History -->
  <g transform="translate(60,248) rotate(1.2)">
    <rect width="560" height="78" rx="10" fill="url(#svr-chip1)" stroke="#2a4864" stroke-width="1"/>
    <rect x="16" y="14" width="50" height="50" rx="10" fill="url(#svr-pink)" filter="url(#svr-glow)"/>
    <text class="svr-badge" x="41" y="45" text-anchor="middle">SH</text>
    <text class="svr-card-t" x="84" y="34">Shell History</text>
    <text class="svr-card-s" x="84" y="55">Ctrl+R and pray you remember the keyword</text>
  </g>

  <!-- Card 3: Dotfiles -->
  <g transform="translate(60,346) rotate(-0.8)">
    <rect width="560" height="78" rx="10" fill="url(#svr-chip1)" stroke="#2a4864" stroke-width="1"/>
    <rect x="16" y="14" width="50" height="50" rx="10" fill="url(#svr-pink)" filter="url(#svr-glow)"/>
    <text class="svr-badge" x="41" y="45" text-anchor="middle">.rc</text>
    <text class="svr-card-t" x="84" y="34">Dotfiles</text>
    <text class="svr-card-s" x="84" y="55">.zshrc aliases you wrote once and are afraid to delete</text>
  </g>

  <!-- Card 4: Notes App -->
  <g transform="translate(60,444) rotate(1.6)">
    <rect width="560" height="78" rx="10" fill="url(#svr-chip1)" stroke="#2a4864" stroke-width="1"/>
    <rect x="16" y="14" width="50" height="50" rx="10" fill="url(#svr-pink)" filter="url(#svr-glow)"/>
    <text class="svr-badge" x="41" y="45" text-anchor="middle">NOTE</text>
    <text class="svr-card-t" x="84" y="34">Notes App</text>
    <text class="svr-card-s" x="84" y="55">One snippet, buried under forty notes titled "misc"</text>
  </g>

  <!-- Card 5: Slack DM to self -->
  <g transform="translate(60,542) rotate(-1.1)">
    <rect width="560" height="78" rx="10" fill="url(#svr-chip1)" stroke="#2a4864" stroke-width="1"/>
    <rect x="16" y="14" width="50" height="50" rx="10" fill="url(#svr-pink)" filter="url(#svr-glow)"/>
    <text class="svr-badge" x="41" y="45" text-anchor="middle">DM</text>
    <text class="svr-card-t" x="84" y="34">Slack DM to Yourself</text>
    <text class="svr-card-s" x="84" y="55">Faster than opening the notes app, impossible to search later</text>
  </g>

  <!-- Arrow between columns -->
  <g>
    <line x1="648" y1="400" x2="732" y2="400" stroke="#4ecbff" stroke-width="3" filter="url(#svr-glow)"/>
    <path d="M 732 400 L 712 388 L 712 412 Z" fill="#4ecbff" filter="url(#svr-glow)"/>
    <text class="svr-note" x="690" y="368" text-anchor="middle">organize</text>
    <text class="svr-note" x="690" y="384" text-anchor="middle">once</text>
  </g>

  <!-- RIGHT: ReferentialSheet workspace -->
  <text class="svr-group" x="760" y="132" fill="#6ee7b7">WITH REFERENTIALSHEET</text>

  <rect x="760" y="150" width="580" height="470" rx="14" fill="#0f2136" stroke="url(#svr-cyan)" stroke-width="1.5"/>
  <text class="svr-card-t" x="788" y="184" fill="#eaf6ff">Your Private Workspace</text>

  <!-- search bar -->
  <rect x="788" y="200" width="524" height="46" rx="8" fill="#0a1728" stroke="#2a4864" stroke-width="1"/>
  <circle cx="812" cy="223" r="7" fill="none" stroke="#6ee7b7" stroke-width="2"/>
  <line x1="817" y1="228" x2="823" y2="234" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round"/>
  <text class="svr-search" x="836" y="229">kubectl get pods --all-namespaces</text>
  <text class="svr-hint" x="1284" y="229" text-anchor="end">instant</text>

  <!-- category chips grid: 3 cols x 3 rows -->
  <g>
    <!-- row 1 -->
    <g transform="translate(788,266)">
      <rect width="164" height="54" rx="8" fill="#15304a" stroke="#2f5372" stroke-width="1"/>
      <text class="svr-chip" x="16" y="32">AWS CLI</text>
      <rect x="128" y="19" width="14" height="16" rx="2" fill="none" stroke="#6ee7b7" stroke-width="1.6"/>
      <rect x="124" y="15" width="14" height="16" rx="2" fill="#0f2136" stroke="#6ee7b7" stroke-width="1.6"/>
    </g>
    <g transform="translate(968,266)">
      <rect width="164" height="54" rx="8" fill="#15304a" stroke="#2f5372" stroke-width="1"/>
      <text class="svr-chip" x="16" y="32">Kubernetes</text>
      <rect x="128" y="19" width="14" height="16" rx="2" fill="none" stroke="#6ee7b7" stroke-width="1.6"/>
      <rect x="124" y="15" width="14" height="16" rx="2" fill="#0f2136" stroke="#6ee7b7" stroke-width="1.6"/>
    </g>
    <g transform="translate(1148,266)">
      <rect width="164" height="54" rx="8" fill="#15304a" stroke="#2f5372" stroke-width="1"/>
      <text class="svr-chip" x="16" y="32">Docker</text>
      <rect x="128" y="19" width="14" height="16" rx="2" fill="none" stroke="#6ee7b7" stroke-width="1.6"/>
      <rect x="124" y="15" width="14" height="16" rx="2" fill="#0f2136" stroke="#6ee7b7" stroke-width="1.6"/>
    </g>
    <!-- row 2 -->
    <g transform="translate(788,335)">
      <rect width="164" height="54" rx="8" fill="#15304a" stroke="#2f5372" stroke-width="1"/>
      <text class="svr-chip" x="16" y="32">Terraform</text>
      <rect x="128" y="19" width="14" height="16" rx="2" fill="none" stroke="#6ee7b7" stroke-width="1.6"/>
      <rect x="124" y="15" width="14" height="16" rx="2" fill="#0f2136" stroke="#6ee7b7" stroke-width="1.6"/>
    </g>
    <g transform="translate(968,335)">
      <rect width="164" height="54" rx="8" fill="#15304a" stroke="#2f5372" stroke-width="1"/>
      <text class="svr-chip" x="16" y="32">Git</text>
      <rect x="128" y="19" width="14" height="16" rx="2" fill="none" stroke="#6ee7b7" stroke-width="1.6"/>
      <rect x="124" y="15" width="14" height="16" rx="2" fill="#0f2136" stroke="#6ee7b7" stroke-width="1.6"/>
    </g>
    <g transform="translate(1148,335)">
      <rect width="164" height="54" rx="8" fill="#15304a" stroke="#2f5372" stroke-width="1"/>
      <text class="svr-chip" x="16" y="32">Regex</text>
      <rect x="128" y="19" width="14" height="16" rx="2" fill="none" stroke="#6ee7b7" stroke-width="1.6"/>
      <rect x="124" y="15" width="14" height="16" rx="2" fill="#0f2136" stroke="#6ee7b7" stroke-width="1.6"/>
    </g>
    <!-- row 3 -->
    <g transform="translate(788,404)">
      <rect width="164" height="54" rx="8" fill="#15304a" stroke="#2f5372" stroke-width="1"/>
      <text class="svr-chip" x="16" y="32">curl</text>
      <rect x="128" y="19" width="14" height="16" rx="2" fill="none" stroke="#6ee7b7" stroke-width="1.6"/>
      <rect x="124" y="15" width="14" height="16" rx="2" fill="#0f2136" stroke="#6ee7b7" stroke-width="1.6"/>
    </g>
    <g transform="translate(968,404)">
      <rect width="164" height="54" rx="8" fill="#15304a" stroke="#2f5372" stroke-width="1"/>
      <text class="svr-chip" x="16" y="32">Bash</text>
      <rect x="128" y="19" width="14" height="16" rx="2" fill="none" stroke="#6ee7b7" stroke-width="1.6"/>
      <rect x="124" y="15" width="14" height="16" rx="2" fill="#0f2136" stroke="#6ee7b7" stroke-width="1.6"/>
    </g>
    <g transform="translate(1148,404)">
      <rect width="164" height="54" rx="8" fill="#15304a" stroke="#2f5372" stroke-width="1"/>
      <text class="svr-chip" x="16" y="32">Vault</text>
      <rect x="128" y="19" width="14" height="16" rx="2" fill="none" stroke="#6ee7b7" stroke-width="1.6"/>
      <rect x="124" y="15" width="14" height="16" rx="2" fill="#0f2136" stroke="#6ee7b7" stroke-width="1.6"/>
    </g>
  </g>

  <text class="svr-card-s" x="788" y="490" fill="#7aaabf">Custom categories, custom colors — private by default, yours to organize</text>
  <line x1="788" y1="512" x2="1312" y2="512" stroke="#213e56" stroke-width="1"/>
  <text class="svr-note" x="788" y="540">One search. One click to copy. No re-Googling.</text>

  <text class="svr-foot" x="60" y="770">Same commands, five places to lose them — or one workspace to find them, every time.</text>
</svg>
