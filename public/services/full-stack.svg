<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Menlo,Consolas,'Courier New',monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f5ff" stroke-opacity=".05"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#00f5ff"/>
    </marker>
    <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#fb923c"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#08131f"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <text x="40" y="60" fill="#00f5ff" font-size="20" letter-spacing="6">SVC 05 · FULL-STACK DEVELOPMENT</text>
  <text x="40" y="88" fill="#5a8090" font-size="14" letter-spacing="3">INTERFACE → API → DATA — SYSTEM BLUEPRINT</text>

  <!-- browser window -->
  <rect x="70" y="140" width="320" height="240" fill="#0d1b2b" stroke="#00f5ff"/>
  <line x1="70" y1="176" x2="390" y2="176" stroke="#00f5ff" stroke-opacity=".4"/>
  <circle cx="92" cy="158" r="5" fill="#ff5f56"/><circle cx="112" cy="158" r="5" fill="#ffbd2e"/><circle cx="132" cy="158" r="5" fill="#27c93f"/>
  <rect x="92" y="196" width="180" height="24" fill="none" stroke="#00f5ff" stroke-opacity=".5"/>
  <rect x="286" y="196" width="82" height="24" fill="#00f5ff" opacity=".85"/>
  <g stroke="#5a8090" stroke-opacity=".8">
    <line x1="92" y1="248" x2="368" y2="248"/><line x1="92" y1="270" x2="330" y2="270"/>
  </g>
  <g fill="none" stroke="#00f5ff" stroke-opacity=".45">
    <rect x="92" y="292" width="84" height="64"/>
    <rect x="188" y="292" width="84" height="64"/>
    <rect x="284" y="292" width="84" height="64"/>
  </g>
  <text x="230" y="412" fill="#5a8090" font-size="13" text-anchor="middle" letter-spacing="2">NEXT.JS / REACT / ANGULAR</text>

  <line x1="390" y1="260" x2="470" y2="260" stroke="#00f5ff" marker-end="url(#mc)"/>
  <text x="430" y="242" fill="#5a8090" font-size="12" text-anchor="middle">HTTPS</text>

  <!-- api layer -->
  <g filter="url(#glow)">
    <rect x="476" y="180" width="200" height="160" fill="#0d1b2b" stroke="#ff0080" stroke-width="1.5"/>
  </g>
  <text x="576" y="212" fill="#ff0080" font-size="16" text-anchor="middle" letter-spacing="2">API LAYER</text>
  <g fill="#08131f" stroke="#ff0080" stroke-opacity=".5">
    <rect x="496" y="228" width="160" height="26"/>
    <rect x="496" y="262" width="160" height="26"/>
    <rect x="496" y="296" width="160" height="26"/>
  </g>
  <text x="576" y="246" fill="#c8e0f4" font-size="13" text-anchor="middle">/auth</text>
  <text x="576" y="280" fill="#c8e0f4" font-size="13" text-anchor="middle">/orders</text>
  <text x="576" y="314" fill="#c8e0f4" font-size="13" text-anchor="middle">/search</text>
  <text x="576" y="372" fill="#5a8090" font-size="13" text-anchor="middle" letter-spacing="2">FASTAPI / SPRING / NODE</text>

  <line x1="676" y1="260" x2="756" y2="260" stroke="#00f5ff" marker-end="url(#mc)"/>

  <!-- services -->
  <g fill="#0d1b2b" stroke="#00ff88">
    <rect x="762" y="186" width="150" height="60"/>
    <rect x="762" y="274" width="150" height="60"/>
  </g>
  <text x="837" y="222" fill="#00ff88" font-size="14" text-anchor="middle" letter-spacing="1">BUSINESS LOGIC</text>
  <text x="837" y="310" fill="#00ff88" font-size="14" text-anchor="middle" letter-spacing="1">BACKGROUND JOBS</text>

  <line x1="912" y1="260" x2="992" y2="260" stroke="#00f5ff" marker-end="url(#mc)"/>

  <!-- database cylinder -->
  <g filter="url(#glow)">
    <path d="M998 216a68 16 0 0 1 136 0v88a68 16 0 0 1-136 0z" fill="#0d1b2b" stroke="#9d00ff"/>
    <ellipse cx="1066" cy="216" rx="68" ry="16" fill="#0d1b2b" stroke="#9d00ff"/>
  </g>
  <text x="1066" y="270" fill="#9d00ff" font-size="14" text-anchor="middle" letter-spacing="1">POSTGRES</text>
  <text x="1066" y="356" fill="#5a8090" font-size="12" text-anchor="middle" letter-spacing="1">SCHEMA · MIGRATIONS</text>

  <!-- ci/cd conveyor -->
  <line x1="70" y1="500" x2="1130" y2="500" stroke="#fb923c" stroke-opacity=".5" stroke-dasharray="2 10"/>
  <text x="70" y="470" fill="#fb923c" font-size="14" letter-spacing="3">CI/CD — EVERY COMMIT</text>
  <g fill="#0d1b2b" stroke="#fb923c">
    <rect x="150" y="474" width="130" height="52"/>
    <rect x="400" y="474" width="130" height="52"/>
    <rect x="650" y="474" width="130" height="52"/>
    <rect x="900" y="474" width="130" height="52"/>
  </g>
  <text x="215" y="506" fill="#fb923c" font-size="14" text-anchor="middle" letter-spacing="2">BUILD</text>
  <text x="465" y="506" fill="#fb923c" font-size="14" text-anchor="middle" letter-spacing="2">TEST</text>
  <text x="715" y="506" fill="#fb923c" font-size="14" text-anchor="middle" letter-spacing="2">AUDIT</text>
  <text x="965" y="506" fill="#fb923c" font-size="14" text-anchor="middle" letter-spacing="2">DEPLOY</text>
  <line x1="280" y1="500" x2="394" y2="500" stroke="#fb923c" marker-end="url(#mo)"/>
  <line x1="530" y1="500" x2="644" y2="500" stroke="#fb923c" marker-end="url(#mo)"/>
  <line x1="780" y1="500" x2="894" y2="500" stroke="#fb923c" marker-end="url(#mo)"/>
  <text x="70" y="580" fill="#5a8090" font-size="13" letter-spacing="2">AUTOMATED TESTS · PERFORMANCE AUDIT · CORE WEB VITALS PASS</text>

  <!-- frame + corner accents -->
  <rect x="16" y="16" width="1168" height="643" fill="none" stroke="#244763"/>
  <path d="M16 44V16h28" fill="none" stroke="#00f5ff" stroke-width="3"/>
  <path d="M1184 631v28h-28" fill="none" stroke="#ff0080" stroke-width="3"/>
