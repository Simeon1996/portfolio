<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Menlo,Consolas,'Courier New',monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f5ff" stroke-opacity=".05"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#00f5ff"/>
    </marker>
    <marker id="my" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#ffe000"/>
    </marker>
    <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#ff0080"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#08131f"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <text x="40" y="60" fill="#00f5ff" font-size="20" letter-spacing="6">SVC 02 · AI AGENTS &amp; AUTOMATION</text>
  <text x="40" y="88" fill="#5a8090" font-size="14" letter-spacing="3">AGENT LOOP — SYSTEM BLUEPRINT</text>

  <!-- bounded loop boundary -->
  <rect x="80" y="140" width="560" height="420" fill="none" stroke="#00f5ff" stroke-opacity=".35" stroke-dasharray="8 8"/>
  <text x="100" y="170" fill="#00f5ff" font-size="13" letter-spacing="2" opacity=".8">BOUNDED LOOP · MAX N STEPS · FULL MEMORY</text>

  <!-- loop nodes: plan / act / observe -->
  <g filter="url(#glow)">
    <rect x="150" y="220" width="150" height="70" fill="#0d1b2b" stroke="#00f5ff" stroke-width="1.5"/>
  </g>
  <text x="225" y="262" fill="#00f5ff" font-size="17" text-anchor="middle" letter-spacing="3">PLAN</text>

  <g filter="url(#glow)">
    <rect x="420" y="220" width="150" height="70" fill="#0d1b2b" stroke="#ff0080" stroke-width="1.5"/>
  </g>
  <text x="495" y="262" fill="#ff0080" font-size="17" text-anchor="middle" letter-spacing="3">ACT</text>

  <g filter="url(#glow)">
    <rect x="285" y="420" width="150" height="70" fill="#0d1b2b" stroke="#00ff88" stroke-width="1.5"/>
  </g>
  <text x="360" y="462" fill="#00ff88" font-size="17" text-anchor="middle" letter-spacing="3">OBSERVE</text>

  <!-- loop arrows -->
  <line x1="300" y1="255" x2="414" y2="255" stroke="#00f5ff" marker-end="url(#mc)"/>
  <path d="M480 290Q450 380 442 424" fill="none" stroke="#00f5ff" marker-end="url(#mc)"/>
  <path d="M280 424Q250 340 232 296" fill="none" stroke="#00f5ff" marker-end="url(#mc)"/>

  <!-- tools rack via MCP -->
  <line x1="570" y1="255" x2="716" y2="255" stroke="#ff0080" stroke-dasharray="6 6" marker-end="url(#mp)"/>
  <text x="643" y="240" fill="#ff0080" font-size="13" text-anchor="middle" letter-spacing="2">MCP</text>

  <rect x="722" y="150" width="230" height="330" fill="#0d1b2b" stroke="#244763"/>
  <text x="837" y="182" fill="#5a8090" font-size="14" text-anchor="middle" letter-spacing="3">YOUR SYSTEMS</text>
  <g fill="#08131f" stroke="#00f5ff" stroke-opacity=".7">
    <rect x="746" y="202" width="182" height="52"/>
    <rect x="746" y="270" width="182" height="52"/>
    <rect x="746" y="338" width="182" height="52"/>
    <rect x="746" y="406" width="182" height="52"/>
  </g>
  <text x="837" y="234" fill="#c8e0f4" font-size="15" text-anchor="middle" letter-spacing="2">DATABASE</text>
  <text x="837" y="302" fill="#c8e0f4" font-size="15" text-anchor="middle" letter-spacing="2">REST APIS</text>
  <text x="837" y="370" fill="#c8e0f4" font-size="15" text-anchor="middle" letter-spacing="2">FILES / DOCS</text>
  <text x="837" y="438" fill="#c8e0f4" font-size="15" text-anchor="middle" letter-spacing="2">TICKETING</text>

  <!-- high-risk gate -->
  <path d="M495 330l60 45-60 45-60-45z" fill="#0d1b2b" stroke="#fb923c"/>
  <text x="495" y="370" fill="#fb923c" font-size="12" text-anchor="middle" letter-spacing="1">HIGH</text>
  <text x="495" y="388" fill="#fb923c" font-size="12" text-anchor="middle" letter-spacing="1">RISK?</text>
  <line x1="495" y1="290" x2="495" y2="324" stroke="#fb923c" stroke-dasharray="5 5"/>

  <!-- human approval -->
  <rect x="646" y="520" width="308" height="80" fill="#0d1b2b" stroke="#ffe000"/>
  <path d="M555 375H700V514" fill="none" stroke="#ffe000" marker-end="url(#my)"/>
  <circle cx="692" cy="548" r="10" fill="none" stroke="#ffe000"/>
  <path d="M676 576c2-12 30-12 32 0" fill="none" stroke="#ffe000"/>
  <text x="722" y="556" fill="#ffe000" font-size="15" letter-spacing="2">HUMAN APPROVAL</text>
  <text x="722" y="580" fill="#5a8090" font-size="12" letter-spacing="1">APPROVE / EDIT / REJECT</text>

  <!-- retries note -->
  <text x="100" y="596" fill="#5a8090" font-size="13" letter-spacing="2">RETRIES · GUARDRAILS · GRACEFUL FAILURE</text>

  <!-- frame + corner accents -->
  <rect x="16" y="16" width="1168" height="643" fill="none" stroke="#244763"/>
  <path d="M16 44V16h28" fill="none" stroke="#00f5ff" stroke-width="3"/>
  <path d="M1184 631v28h-28" fill="none" stroke="#ff0080" stroke-width="3"/>
</svg>
